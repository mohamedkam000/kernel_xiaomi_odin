name: Build Kernel

on:
  workflow_dispatch:

env:
  DEFCONFIG: odin_defconfig
  ARCH: arm64
  ODIR: out
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_DIR: anykernel3
  ZIP_NAME: odin_kernel.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone kernel source
        run:
          git clone --depth=1 https://github.com/mohamedkam000/kernel_xiaomi_odin.git kernel

      - name: Install build dependencies and LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libelf-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift

      - name: Build Image
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH=/usr/lib/llvm-19/bin:$PATH
          export ARCH=arm64
          export CC=clang-19
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld-19
          export LLVM=1
          make $DEFCONFIG
          make -j$(nproc)

      - name: Clone AnyKernel3
        working-directory: kernel
        run: |
          git clone --depth=1 $ANYKERNEL_REPO $ANYKERNEL_DIR

      - name: Copy kernel image to AnyKernel3
        working-directory: kernel
        run: |
          cp arch/arm64/boot/Image $ANYKERNEL_DIR

      - name: Create flashable AnyKernel3 zip
        working-directory: kernel
        run: |
          cd $ANYKERNEL_DIR
          rm -rf .git || true
          zip -r "../$ZIP_NAME" . -x "*.git*" || true
          cd ..
          ls -la $ZIP_NAME

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zip
          path: |
            $ZIP_NAME
