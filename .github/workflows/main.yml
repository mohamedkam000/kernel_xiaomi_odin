name: Build Kernel

on:
  workflow_dispatch:

env:
  DEFCONFIG: odin_defconfig
  ARCH: arm64
  ODIR: out
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_DIR: anykernel3
  ZIP_NAME: odin_kernel.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone kernel source
        run:
          git clone --depth=1 https://github.com/mohamedkam000/kernel_xiaomi_odin.git kernel

      - name: Install build dependencies and LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncurses5-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s 19
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift

#      - name: Set environment for build
#        run: |
#          echo "PATH=/usr/lib/llvm-19/bin:$PATH" >> $GITHUB_ENV
#          echo "CLANG_BIN=/usr/lib/llvm-19/bin" >> $GITHUB_ENV
#          echo "CC=clang-19" >> $GITHUB_ENV
#          echo "LD=ld.lld-19" >> $GITHUB_ENV
